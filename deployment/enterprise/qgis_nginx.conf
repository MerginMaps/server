# extract trace id from W3C traceparent header (00-<trace_id>-<span_id>-<flags>) sent by mergin server
map $http_traceparent $trace_id {
  "~^[0-9a-f]{2}-(?<tid>[0-9a-f]{32})-" $tid;
  default "-";
}

# rt: total request time, urt: qgis server response time
log_format traced '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                  'rt=$request_time urt=$upstream_response_time trace_id=$trace_id';

server {
  listen 80;
  server_name _;
  access_log /var/log/nginx/access.log traced;

  location / {
    proxy_buffers 16 16k;
    proxy_buffer_size 16k;
    gzip off;
    include fastcgi_params;
    fastcgi_pass  qgis:5555;
    # Wait up to 10 seconds for the qgis-server fastcgi application
    # to return a response.
    fastcgi_read_timeout 10s;
  }

}
