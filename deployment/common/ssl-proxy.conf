
server {
    listen       80;
    server_name merginmaps.company.com;  # FIXME

    if ($scheme != "https") {
            return 301 https://$host$request_uri;
    }
}

upstream app_server {
    # route to the application proxy
    server 127.0.0.1:8080 fail_timeout=0;
}

server {
    listen              443 ssl;
    server_name         merginmaps.company.com; # FIXME
    client_max_body_size 4G;

    ssl_certificate_key /etc/letsencrypt/live/merginmaps.company.com/privkey.pem; # FIXME
    ssl_certificate     /etc/letsencrypt/live/merginmaps.company.com/fullchain.pem; # FIXME

    # Don't show version information
    server_tokens off;

    # Enable gzip compression
    gzip on;
    gzip_min_length 10240;
    gzip_comp_level 1;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/x-javascript;

    # Prevent crawlers from indexing and following links for all content served from the mergin app
    add_header X-Robots-Tag "none";

    # Protect against clickjacking iframe
    add_header Content-Security-Policy "frame-ancestors 'self';" always;

    # Add a HSTS policy to prevent plain http from browser
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Set cookies security flags
    proxy_cookie_flags ~ secure httponly samesite=strict;

    location / {
        root /var/www/html;

        # The lines below were copied from application proxy
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        # we don't want nginx trying to do something clever with
        # redirects, we set the Host: header above already.
        proxy_redirect off;
        proxy_pass http://app_server;
    }

    # Enterprise edition maps locations
    # Embeddable map view - allow framing from any origin
    location ^~ /maps/embed/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        # we don't want nginx trying to do something clever with
        # redirects, we set the Host: header above already.
        proxy_redirect off;
        proxy_pass http://app_server;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors *;" always;
        # add_header here disables inheritance of server-level headers, so repeat them
        add_header X-Robots-Tag "none";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # OGC API endpoints - allow cross-origin requests from any origin
    location ^~ /v2/ogc/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Range" always;
        add_header Access-Control-Max-Age 5 always;
        # add_header here disables inheritance of server-level headers, so repeat them
        add_header X-Robots-Tag "none";
        add_header Content-Security-Policy "frame-ancestors 'self';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_pass http://app_server;
    }
}
