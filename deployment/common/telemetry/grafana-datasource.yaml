apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    url: http://merginmaps-prometheus:9090
    isDefault: true
  - name: Tempo
    type: tempo
    url: http://merginmaps-tempo:3200
  - name: Loki
    type: loki
    url: http://merginmaps-loki:3100
    jsonData:
      derivedFields:
        - datasourceUid: Tempo
          # Finds the trace_id in mergin server logs ("[INFO] [<trace_id>]") or qgis nginx access logs ("trace_id=<trace_id>")
          matcherRegex: '(?:\[(?:ACCESS|INFO|ERROR)\]\s\[|trace_id=)(\w{32})'
          name: TraceID
          url: '$${__value.raw}' # The raw ID value used to query Tempo
